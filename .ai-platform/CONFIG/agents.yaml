# Agent = 역할 (계획서 6.2)
agents:
  - id: planning
    role: Planning Agent
    description: 사용자와 대화하며 요구사항, 기획서, 사용자 시나리오 작성
  - id: architect
    role: Architect Agent
    description: 아키텍처, DB, API, 기술스택 설계
  - id: developer
    role: Developer Agent
    description: 코드 작성, 기능 구현, 리팩토링
  - id: reviewer
    role: Reviewer Agent
    description: 코드 리뷰, 구조 검증, 유지보수성 검토
  - id: tester
    role: Tester Agent
    description: 테스트 코드 작성, 테스트 실행, 실패 분석
  - id: security
    role: Security Agent
    description: 보안 취약점, 시크릿 노출, 인증/인가 검토
